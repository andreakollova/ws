services:
  # Cron job: scrapes GoOut + Tootoot 4x/day, saves free events to Supabase
  - type: cron
    name: woeva-scraper
    runtime: python
    buildCommand: pip install -r requirements.txt
    # 4x/day: 09:00, 13:00, 17:00, 21:00 CET (= 08:00, 12:00, 16:00, 20:00 UTC)
    schedule: "0 8,12,16,20 * * *"
    startCommand: python run_scraper.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Cron: Oscar lifestyle post — 09:15 CEST (07:15 UTC)
  - type: cron
    name: woeva-oscar-lifestyle
    runtime: python
    buildCommand: pip install requests
    schedule: "15 7 * * *"
    startCommand: python -c "import requests,os; r=requests.post('https://woeva-oscar.vercel.app/api/cron',headers={'x-password':os.environ['OSCAR_PASSWORD']}); print(r.status_code, r.text[:200])"
    envVars:
      - key: OSCAR_PASSWORD
        sync: false

  # Cron: Oscar animation post — 15:00 CEST (13:00 UTC)
  - type: cron
    name: woeva-oscar-animation
    runtime: python
    buildCommand: pip install requests
    schedule: "0 13 * * *"
    startCommand: python -c "import requests,os; r=requests.post('https://woeva-oscar.vercel.app/api/cron-animation',headers={'x-password':os.environ['OSCAR_PASSWORD']}); print(r.status_code, r.text[:200])"
    envVars:
      - key: OSCAR_PASSWORD
        sync: false

  # Worker: Discord bot — polls Supabase, sends events for approval, posts to Instagram
  - type: worker
    name: woeva-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: BOT_USER_ID
        value: "00000000-0000-0000-0000-000000000001"
      - key: POLL_INTERVAL
        value: "300"
